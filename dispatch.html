<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Foodora Dispatch</title><link rel="stylesheet" href="partner.css"><style>.admin{max-width:1100px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.formbox{padding:20px;margin:18px 0}.list{display:grid;gap:10px}.rowitem{padding:15px;border:1px solid var(--line);border-radius:14px;background:#142236}.rowitem strong{display:block}.rowitem small{color:var(--muted)}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.formrow{grid-template-columns:1fr}}</style></head><body><main class="shell admin"><header><a class="brand" href="/">FOODORA <span>DISPATCH</span></a></header><section class="panel formbox"><p class="eyebrow">ADMIN ACCESS</p><h1>Delivery Dispatch</h1><label>Admin Key<input id="key" type="password" autocomplete="off"></label><button id="connect" class="primary">Connect securely</button><p id="msg" class="muted" role="status"></p></section><section id="workspace" hidden><div class="grid"><form id="create" class="panel formbox"><h2>Create delivery partner</h2><label>Full name<input name="name" required maxlength="80"></label><label>Mobile number<input name="phone" inputmode="numeric" maxlength="11" required></label><label>Temporary password (10+ characters)<input name="password" type="password" minlength="10" maxlength="128" required></label><button class="primary">Create partner</button></form><form id="assign" class="panel formbox"><h2>Assign an order</h2><label>Order<select name="orderId" id="orderSelect" required></select></label><label>Delivery partner<select name="partnerId" id="partnerSelect" required></select></label><button class="primary">Assign order</button></form></div><div class="grid"><section><h2>Partner directory</h2><div id="partners" class="list"></div></section><section><h2>Active assignments</h2><div id="assignments" class="list"></div></section></div></section></main><script src="dispatch.js" defer></script></body></html>
