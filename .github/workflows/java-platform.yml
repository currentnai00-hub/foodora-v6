name: Foodora Java Platform

on:
  pull_request:
    paths:
      - "platform/java-backend/**"
      - ".github/workflows/java-platform.yml"
  push:
    branches: [main]
    paths:
      - "platform/java-backend/**"
      - ".github/workflows/java-platform.yml"

permissions:
  contents: read

jobs:
  java-platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foodora_java_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d foodora_java_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Java tests on H2
        working-directory: platform/java-backend
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Run full Java test suite on isolated PostgreSQL 16
        working-directory: platform/java-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/foodora_java_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn --batch-mode --no-transfer-progress verify
