name: Foodora quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/customer-order-tracking-admin-dashboard]

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check backend JavaScript syntax
        run: node --check server.js
      - name: Check wallet service JavaScript syntax
        run: node --check wallet.js
      - name: Check customer account JavaScript syntax
        run: node --check account.js
      - name: Check customer tracking JavaScript syntax
        run: node --check track.js
      - name: Check customer menu JavaScript syntax
        run: node --check script.js
      - name: Check Admin dashboard JavaScript syntax
        run: node --check admin.js
      - name: Check payment guide JavaScript syntax
        run: node --check payment-guide.js
      - name: Check individual food page JavaScript syntax
        run: node --check product-page.js
      - name: Extract and check admin dashboard JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("admin.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline admin script found")
          Path("/tmp/admin-inline.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/admin-inline.js
      - name: Check manual payment safety invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path("server.js").read_text(encoding="utf-8")
          admin = Path("admin.js").read_text(encoding="utf-8")
          guide = Path("PAYMENT_SETUP.md").read_text(encoding="utf-8")
          assert "pg_advisory_xact_lock(hashtextextended($1,0))" in server
          assert "orders_payment_transaction_lookup_idx" in server
          assert "This Transaction ID has already been submitted" in server
          assert "payment-review" in admin
          assert "paymentStatus:$" not in admin
          assert "Pending verification" in server
          assert "Payment manually verified" in admin
          assert "not proof of payment" in guide
          assert "PINs, OTPs" in guide
          print("Manual payment safety invariants present.")
          PY
      - name: Check tracking privacy and analytics safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path("server.js").read_text(encoding="utf-8")
          tracking = Path("track.js").read_text(encoding="utf-8")
          assert 'app.post("/api/orders/track"' in server
          assert 'adminOnly' in server[server.find('app.get("/api/admin/analytics"'):server.find('app.get("/api/admin/products"')]
          assert 'fetch("/api/orders/track"' in tracking
          assert '?phone=' not in tracking
          assert 'Order complete' in tracking
          print("Tracking and analytics safeguards present.")
          PY
