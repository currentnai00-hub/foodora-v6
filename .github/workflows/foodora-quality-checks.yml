name: Foodora quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run complete Node.js test suite
        run: npm test
      - name: Check homepage product quick view
        run: |
          node --check homepage-quick-view.js
          node tests/homepage-quick-view-guards.js
      - name: Check backend JavaScript syntax
        run: node --check server.js
      - name: Check wallet service JavaScript syntax
        run: node --check wallet.js
      - name: Check customer account JavaScript syntax
        run: node --check account.js
      - name: Check cumulative customer reward safety guards
        run: node tests/customer-rewards-guards.js
      - name: Check customer tracking JavaScript syntax
        run: |
          node --check track.js
          node tests/customer-order-stream-guards.js
      - name: Check customer menu JavaScript syntax
        run: node --check script.js
      - name: Check homepage slider and discovery experience
        run: |
          node --check homepage-sliders.js
          node tests/homepage-slider-guards.js
          node --check homepage-experience.js
          node tests/homepage-experience-guards.js
      - name: Check customer taste finder
        run: |
          node --check homepage-taste-finder.js
          node tests/homepage-taste-finder-guards.js
      - name: Check homepage Mystery Food Box
        run: |
          node --check homepage-mystery-box.js
          node tests/homepage-mystery-box-guards.js
      - name: Check homepage Flavorverse experience
        run: |
          node --check homepage-flavorverse.js
          node tests/homepage-flavorverse-guards.js
      - name: Check Foodora entry animation
        run: |
          node --check homepage-entry-intro.js
          node tests/homepage-entry-intro-guards.js
      - name: Check Admin dashboard JavaScript syntax
        run: node --check admin.js
      - name: Check payment guide JavaScript syntax
        run: node --check payment-guide.js
      - name: Check individual food page JavaScript syntax
        run: node --check product-page.js
      - name: Extract and check admin dashboard JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("admin.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline admin script found")
          Path("/tmp/admin-inline.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/admin-inline.js
      - name: Check manual payment safety invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path("server.js").read_text(encoding="utf-8")
          admin = Path("admin.js").read_text(encoding="utf-8")
          guide = Path("PAYMENT_SETUP.md").read_text(encoding="utf-8")
          assert "pg_advisory_xact_lock(hashtextextended($1,0))" in server
          assert "orders_payment_transaction_lookup_idx" in server
          assert "This Transaction ID has already been submitted" in server
          assert "payment-review" in admin
          assert "paymentStatus:$" not in admin
          assert "Pending verification" in server
          assert "Payment manually verified" in admin
          assert "not proof of payment" in guide
          assert "PINs, OTPs" in guide
          print("Manual payment safety invariants present.")
          PY
      - name: Check payment UI integration guards
        run: node tests/payment-ui-integration-guards.js
      - name: Check ZIP backup format and integrity
        run: node tests/zip-backup-format.js
      - name: Check backup and restore V2 safety guards
        run: node tests/backup-restore-v2-guards.js
      - name: Check private data is not statically exposed
        run: node tests/static-private-data-guards.js
      - name: Check response security headers
        run: node tests/security-response-headers-guards.js
      - name: Check encrypted off-site backup workflow safeguards
        run: node tests/offsite-backup-workflow-guards.js
      - name: Check Operations Control Tower JavaScript and safety guards
        run: |
          node --check operations.js
          node tests/operations-control-tower-guards.js
      - name: Check delivery partner portal syntax and security guards
        run: |
          node --check partner-portal.js
          node --check partner.js
          node --check dispatch.js
          node tests/delivery-partner-portal-guards.js
      - name: Check realtime event stream syntax and safety
        run: |
          node --check event-stream.js
          node --check customer-order-stream.js
          node tests/realtime-event-stream-guards.js
      - name: Check PWA JavaScript syntax
        run: |
          node --check sw.js
          node --check app-pwa.js
      - name: Check PWA manifest and offline cache safety
        run: node tests/pwa-safety-guards.js
      - name: Check tracking privacy and analytics safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path("server.js").read_text(encoding="utf-8")
          tracking = Path("track.js").read_text(encoding="utf-8")
          assert 'app.post("/api/orders/track"' in server
          assert 'adminOnly' in server[server.find('app.get("/api/admin/analytics"'):server.find('app.get("/api/admin/products"')]
          assert 'fetch("/api/orders/track"' in tracking
          assert '?phone=' not in tracking
          assert 'Order complete' in tracking
          print("Tracking and analytics safeguards present.")
          PY

  postgres-payment-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: foodora_test
          POSTGRES_PASSWORD: foodora_test_password
          POSTGRES_DB: foodora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodora_test -d foodora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://foodora_test:foodora_test_password@localhost:5432/foodora_test
      NODE_ENV: test
      PORT: 8080
      ADMIN_KEY: ci-test-admin-key
      PAYMENT_METHODS: bKash,Nagad,Cash on Delivery
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Start app against isolated CI database
        run: |
          nohup npm start > /tmp/foodora-server.log 2>&1 &
          echo $! > /tmp/foodora-server.pid
      - name: Run PostgreSQL payment end-to-end tests
        run: node tests/postgres-payment-e2e.js
      - name: Run cumulative customer rewards PostgreSQL E2E tests
        run: node tests/customer-rewards-e2e.js
      - name: Run PostgreSQL realtime event outbox E2E tests
        run: node tests/realtime-event-stream-e2e.js
      - name: Run PostgreSQL customer order event E2E tests
        run: node tests/customer-order-stream-e2e.js
      - name: Run isolated PostgreSQL ZIP backup and restore end-to-end tests
        run: node tests/postgres-backup-restore-e2e.js
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/foodora-server.log
