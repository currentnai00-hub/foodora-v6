<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foodora Admin</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head><body class="admin-body"><header class="topbar"><a class="brand" href="/">foodora<span>.</span> <small>ADMIN</small></a><a href="/">← Storefront</a></header><main class="admin-wrap"><section id="loginPanel" class="admin-login"><p class="eyebrow">CONTROL CENTRE</p><h1>Admin dashboard</h1><p>Enter your private admin key to continue.</p><input id="adminKey" type="password" placeholder="Admin key" autocomplete="current-password"><button id="loginBtn" class="primary-button full">Connect securely</button><div id="loginMessage" class="notice"></div></section><section id="dashboard" hidden><div class="admin-title"><div><p class="eyebrow">FOODORA OPERATIONS</p><h1>Dashboard</h1></div><button id="logoutBtn" class="light-button">Log out</button></div><div id="stats" class="stats-grid"></div><div class="admin-tabs"><button class="tab active" data-tab="orders">Orders</button><button class="tab" data-tab="products">Products</button><button class="tab" data-tab="coupons">Coupons</button><button class="tab" data-tab="reviews">Reviews</button></div><section id="ordersTab" class="panel"><h2>Recent orders</h2><div id="ordersTable"></div></section><section id="productsTab" class="panel" hidden><div class="panel-head"><h2>Products & stock</h2><button id="addProductBtn" class="primary-button">+ Add product</button></div><div id="productsTable"></div><form id="productForm" class="admin-form" hidden><h3 id="productFormTitle">Add product</h3><input name="id" placeholder="ID (leave blank for automatic)"><input name="name" placeholder="Product name" required><input name="category" placeholder="Category" required><input name="price" type="number" min="1" placeholder="Price (BDT)" required><input name="stock" type="number" min="0" placeholder="Stock" required><input name="emoji" placeholder="Emoji e.g. 🍔"><input name="image" placeholder="Image URL (optional)"><textarea name="description" placeholder="Description"></textarea><button class="primary-button">Save product</button><button type="button" id="cancelProduct" class="light-button">Cancel</button><div id="productMessage" class="notice"></div></form></section><section id="couponsTab" class="panel" hidden><h2>Coupon management</h2><form id="couponForm" class="coupon-admin"><input name="code" placeholder="CODE" required><select name="type"><option value="percent">Percentage %</option><option value="fixed">Fixed ৳</option></select><input name="value" type="number" min="1" placeholder="Value" required><input name="minOrder" type="number" min="0" placeholder="Minimum order"><button class="primary-button">Save coupon</button></form><div id="couponsTable"></div></section><section id="reviewsTab" class="panel" hidden><h2>Customer reviews</h2><div id="reviewsTable"></div></section></section></main><script src="/admin.js"></script></body></html>
