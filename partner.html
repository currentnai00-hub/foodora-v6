<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Foodora Partner</title><link rel="stylesheet" href="partner.css"></head>
<body><main class="shell"><header><a class="brand" href="/">FOODORA <span>PARTNER</span></a><button id="logout" class="ghost" hidden>লগআউট</button></header>
<section id="login" class="panel login"><p class="eyebrow">DELIVERY NETWORK</p><h1>Partner sign in</h1><p class="muted">আপনার বরাদ্দ করা ডেলিভারি অর্ডার পরিচালনা করুন।</p><form id="loginForm"><label>মোবাইল নম্বর<input name="phone" inputmode="numeric" autocomplete="username" maxlength="11" required></label><label>পাসওয়ার্ড<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">নিরাপদে লগইন</button><p id="loginError" class="error" role="alert"></p></form></section>
<section id="dashboard" hidden><div class="welcome"><div><p class="eyebrow">DELIVERY WORKSPACE</p><h1 id="greeting">আপনার ডেলিভারি</h1><p class="muted">শুধু আপনার জন্য বরাদ্দ করা অর্ডারগুলো এখানে দেখানো হয়।</p></div><button id="refresh" class="ghost">↻ রিফ্রেশ</button></div><div class="stats"><article class="stat"><span>চলমান অর্ডার</span><strong id="activeCount">0</strong></article><article class="stat"><span>সম্পন্ন ডেলিভারি</span><strong id="doneCount">0</strong></article></div><h2>Active assignments</h2><div id="orders" class="orders"></div><h2>সম্প্রতি সম্পন্ন</h2><div id="history" class="orders"></div><p id="notice" class="muted" aria-live="polite"></p></section></main><script src="partner.js" defer></script></body></html>
